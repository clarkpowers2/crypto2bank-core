name: Guardian Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        with:
          fail: true

      - name: Crypto hygiene check
        run: |
          ! grep -R "crypto.createCipher(" . || exit 1
          ! grep -R "md5(" . || exit 1
          ! grep -R "sha1(" . || exit 1
