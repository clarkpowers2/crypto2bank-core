name: Guardian Full System Audit

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  guardian-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: crypto2bank/crypto2bank-verify/packages/core
        run: npm ci

      - name: Run Guardian Full Audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        working-directory: crypto2bank/crypto2bank-verify/packages/core
        run: |
          node ../../guardian-core/cli/guardian.js audit \
            --target=all \
            --mode=full \
            --health-check \
            --verify-integrations \
            --db-check \
            --read-only \
            --export=json

      - name: Upload Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: guardian-audit-report
          path: crypto2bank/crypto2bank-verify/packages/core/guardian/reports/
